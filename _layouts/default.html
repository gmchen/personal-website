<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>

  <body class="{% if site.navbar_fixed %}fixed-top-nav{% endif %}">
    {% include header.html %}

    <div class="container mt-5">
      {{ content }}
    </div>

    <script src="{{ '/assets/js/vendor/jquery.min.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/vendor/bootstrap.min.js' | relative_url }}"></script>
    {% if site.enable_mansory %}
    <script defer src="{{ '/assets/js/vendor/masonry.pkgd.min.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/vendor/imagesloaded.pkgd.min.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/mansory.js' | relative_url }}"></script>
    {% endif %}
    <script src="{{ '/assets/js/dark_mode.js' | relative_url }}"></script>
  </body>
</html>
