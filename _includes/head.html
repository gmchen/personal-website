<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<title>{{ site.first_name }} {{ site.last_name }}{% if page.title and page.url != "/" %} | {{ page.title }}{% endif %}</title>
<meta name="description" content="{{ site.description | strip }}">

<meta property="og:type" content="website">
<meta property="og:title" content="{% if page.url == '/' %}Greg Chen{% else %}{{ page.title }}{% endif %}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:description" content="{{ site.description | strip }}">
<meta property="og:image" content="{{ '/assets/img/prof_pic.jpg' | absolute_url }}">
<link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">

<link rel="stylesheet" href="{{ '/assets/css/vendor/bootstrap.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/vendor/mdb.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/vendor/fontawesome.min.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/vendor/google-fonts.css' | relative_url }}">
<link rel="shortcut icon" href="{{ '/assets/img/favicon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

{% if site.enable_darkmode %}
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
{% endif %}
