# Site
first_name: Greg
last_name: Chen
description: >
  Greg Chen, MD, PhD: physician-scientist developing next-generation immunotherapies for cancer.
url: "https://gregorymchen.com"
baseurl: ""

# Layout
navbar_fixed: true
max_width: 800px
enable_mansory: true
enable_darkmode: true

# Content
collections:
  projects:
    output: true
    permalink: /projects/:path/

# Build
markdown: kramdown
kramdown:
  input: GFM
include: ['_pages']
exclude: [vendor, Gemfile, Gemfile.lock, LICENSE, README.md]
plugins:
  - jekyll-sitemap
